name = "dicho-y-hecho"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "dicho-y-hecho-db"
database_id = "e5ecfdff-65b5-4ead-9332-0be7da09d51c"

# Secret requerido (panel de gestión): ADMIN_KEY

# Corre cada 5 minutos: avisos demorados a los 45 min y, a las 10:00 de Argentina, el aviso diario de pedidos por vencer
[triggers]
crons = ["*/5 * * * *"]

# Secrets de push: VAPID_PUBLIC y VAPID_PRIVATE (ver tools/generar-vapid.mjs)
{
  "observability": {
    "logs": {
      "enabled": true,
      "invocation_logs": true
    }
  }
}
